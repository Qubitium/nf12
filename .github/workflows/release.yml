name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wheels:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.21"
          enable-cache: false
      - name: Check release version
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(uv version --short)"
      - name: Free unused hosted-runner SDKs
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - name: Build and check wheel
        env:
          WHEEL_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/nf12-dist"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/io:ro" \
            -v "$RUNNER_TEMP/nf12-dist:/dist" \
            -v "$(command -v uv):/usr/local/bin/uv:ro" \
            -w /io \
            -e WHEEL_ARCH \
            -e CMAKE_BUILD_PARALLEL_LEVEL=2 \
            -e UV_NO_CACHE=1 \
            nvidia/cuda:13.0.3-devel-rockylinux8@sha256:9dadf4a6e25361c04f822d687b6510203d02d3afd6d9d7c489229462f7b77d8e \
            bash tools/build_release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-wheel-${{ matrix.arch }}
          path: ${{ runner.temp }}/nf12-dist/*.whl
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: wheels
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/nf12
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-wheel-*
          merge-multiple: true
          path: dist
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.21"
          enable-cache: false
      - name: Publish with PyPI Trusted Publishing
        run: uv publish --trusted-publishing always dist/*.whl

  github-release:
    name: Create GitHub release
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create release from the pushed tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes
